# Deploy this file as .github/workflows/update-feed.yml in conghuahuadan/ShellPort.
name: Publish update feed
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shellport-update-pages
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch deployment from the permitted branch
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-feed.yml',
              ref: 'master'
            });
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify public release and generate feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-feed.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/update-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified feed
        id: deployment
        uses: actions/deploy-pages@v4

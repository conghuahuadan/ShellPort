# Deploy this file as .github/workflows/update-feed.yml in conghuahuadan/ShellPort.
name: Publish update feed
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shellport-update-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify public release and generate feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-feed.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/update-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified feed
        id: deployment
        uses: actions/deploy-pages@v4
